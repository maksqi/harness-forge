# Dependency updates (ADR-027). Dependabot alerts and security updates are switched on in the repository settings
# (Settings -> Code security); this file only schedules version updates.
#
# pnpm 11: Dependabot supports pnpm workspaces and catalogs, but its pnpm 11 support is recent and pnpm 11.23+ breaks
# indirect-dependency updates. If the npm block below fails on the pnpm 11 lockfile, drop the npm block and use
# Renovate (renovatebot, which updates pnpm catalogs) as the fallback. pnpm itself is always upgraded by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before they are proposed. The default cooldown equals pnpm 11's built-in
    # minimum-release-age (1 day): a longer cooldown made Dependabot "update" to the newest release older than the
    # cooldown, which can be *older* than the locked version (PR #1 downgraded ai 7.0.116 -> 7.0.107).
    cooldown:
      default-days: 1
      semver-major-days: 30
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    # A package matches the first group whose patterns and update types fit it; an update that fits no group gets a
    # pull request of its own. 0.x packages treat a minor bump as breaking, but Dependabot calls it "semver-minor",
    # so they are kept out of the minor-and-patch group: their patches share one group and each of their minor
    # bumps gets its own pull request (this is how katex 0.16 -> 0.18 must arrive).
    groups:
      # ai and @ai-sdk/vue must stay on matching versions (the web's useChat options come from ai).
      ai-sdk:
        patterns: [ai, '@ai-sdk/*', '@openrouter/ai-sdk-provider']
        update-types: [minor, patch]
      # The ORM and its migration generator move together (both 0.x).
      drizzle:
        patterns: [drizzle-orm, drizzle-kit]
      zero-major-patches:
        patterns: [katex, '@hono/zod-validator', '@libsql/client', esbuild, fflate, tsdown, class-variance-authority]
        update-types: [patch]
      minor-and-patch:
        patterns: ['*']
        exclude-patterns:
          - ai
          - '@ai-sdk/*'
          - '@openrouter/ai-sdk-provider'
          - drizzle-orm
          - drizzle-kit
          - katex
          - '@hono/zod-validator'
          - '@libsql/client'
          - esbuild
          - fflate
          - tsdown
          - class-variance-authority
        update-types: [minor, patch]
    ignore:
      # ADR-013: TypeScript stays on ~6.0.3 (TypeScript 7 breaks .vue files that import prop types).
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Node 22 is the supported floor (engines: >=22.12), so the Node types stay on 22.x.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The pnpm version ("packageManager") is upgraded by hand.
      - dependency-name: pnpm
