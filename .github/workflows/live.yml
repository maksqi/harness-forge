# Live provider suite (ADR-027, docs/PROVIDERS.md section 12): real, PAID requests against every builtin provider whose
# key is available. Manual dispatch only; never on push or pull requests.
#
# One-time setup by a repository admin: Settings -> Environments -> New environment "live-providers" -> Required
# reviewers (the maintainer) -> add the provider keys as environment secrets, named like the variables of
# PROVIDERS.md section 12 (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...). A missing secret is an empty variable, which the
# suite reports as SKIP. Ollama needs a local server and is always skipped here. The summary table (variable names,
# never values) is written to the job summary.
name: Live providers

on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Provider ids to run, comma separated (empty: every provider with a key; "none": a dry run)'
        required: false
        default: ''
      max-cost-usd:
        description: Budget of the run in USD (HF_LIVE_MAX_COST_USD)
        required: false
        default: '0.50'

permissions:
  contents: read

concurrency:
  group: live-providers
  cancel-in-progress: false

jobs:
  live:
    name: Live provider suite (paid calls)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The environment holds the keys and requires a reviewer's approval before the job starts.
    environment: live-providers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run the live suite (pnpm test:live)
        env:
          HF_LIVE_PROVIDERS: ${{ inputs.providers }}
          HF_LIVE_MAX_COST_USD: ${{ inputs.max-cost-usd }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm test:live
